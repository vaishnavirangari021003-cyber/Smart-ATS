<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
  <title>Job Details | HireFlow</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Public Navigation Bar -->
  <header class="navbar-public">
    <div class="container">
      <a href="index.html" class="brand-link" aria-label="HireFlow Home">
        <svg viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="#4F46E5"/><path d="M12 28V12L20 20L28 12V28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="20" r="2.5" fill="#FFFFFF"/></svg>
        <span>HireFlow</span>
      </a>

      <nav aria-label="Main Navigation">
        <ul class="nav-links">
          <li><a href="index.html#jobs">Browse Jobs</a></li>
          <li><a href="index.html#how-it-works">How It Works</a></li>
          <li><a href="login.html">Sign In</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <button type="button" class="btn-icon btn-ghost" data-action="toggle-theme" aria-label="Toggle theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
        <div id="auth-nav-buttons" class="flex gap-2">
          <a href="login.html" class="btn btn-secondary btn-sm">Sign In</a>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content" class="container" style="padding-top: var(--space-6); padding-bottom: var(--space-12);">
    <!-- Breadcrumbs -->
    <nav class="breadcrumbs" aria-label="Breadcrumbs">
      <a href="index.html">Jobs</a>
      <span class="breadcrumbs-sep">/</span>
      <span id="breadcrumb-title" class="text-muted">Loading...</span>
    </nav>

    <div id="job-details-container" class="job-detail-grid">
      <!-- Loading Skeleton -->
      <div class="card">
        <div class="skeleton" style="height: 36px; width: 60%; margin-bottom: 16px;"></div>
        <div class="skeleton" style="height: 20px; width: 40%; margin-bottom: 24px;"></div>
        <div class="skeleton" style="height: 120px; width: 100%;"></div>
      </div>
      <div class="card">
        <div class="skeleton" style="height: 300px; width: 100%;"></div>
      </div>
    </div>

    <!-- Similar Jobs Section -->
    <section style="margin-top: var(--space-12); border-top: 1px solid var(--border); padding-top: var(--space-8);">
      <h2 style="font-size: var(--font-size-xl); margin-bottom: var(--space-4);">Similar Opportunities</h2>
      <div id="similar-jobs-list" class="grid gap-4" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
        <!-- Injected via JS -->
      </div>
    </section>
  </main>

  <footer style="background: var(--surface); border-top: 1px solid var(--border); padding: var(--space-8) 0; margin-top: auto;">
    <div class="container flex justify-between items-center" style="flex-wrap: wrap; gap: var(--space-4);">
      <div class="flex items-center gap-2">
        <span class="font-bold">HireFlow</span>
        <span class="text-sm text-muted">© 2026 Acme Innovations. Demo simulation only.</span>
      </div>
      <a href="index.html" class="text-sm text-muted">Back to all jobs</a>
    </div>
  </footer>

  <script type="module" src="js/pages/job-details.page.js"></script>
</body>
</html>
