<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
  <title>404 Page Not Found | HireFlow</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="navbar-public">
    <div class="container">
      <a href="index.html" class="brand-link">
        <svg viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="#4F46E5"/><path d="M12 28V12L20 20L28 12V28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="20" r="2.5" fill="#FFFFFF"/></svg>
        <span>HireFlow</span>
      </a>
      <div class="nav-actions">
        <button type="button" class="btn-icon btn-ghost" data-action="toggle-theme" aria-label="Toggle theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content" class="container">
    <div class="error-page-container">
      <div class="error-code">404</div>
      <h1 style="font-size: var(--font-size-2xl); margin-bottom: var(--space-2);">Page Not Found</h1>
      <p class="text-muted" style="max-width: 520px; margin-bottom: var(--space-6);">
        The page or job record you are looking for does not exist or may have been relocated.
      </p>
      <div class="flex gap-3">
        <button type="button" class="btn btn-secondary" onclick="window.history.back()">Go Back</button>
        <a href="index.html" class="btn btn-primary">Browse All Jobs</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { initDemoBanner, setupThemeToggle } from './js/lib/ui.js';
    initDemoBanner();
    setupThemeToggle();
  </script>
</body>
</html>
